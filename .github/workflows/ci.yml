name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.26"}
      - run: go vet ./...
      - run: GOOS=js GOARCH=wasm go vet ./cmd/web
      - run: go test -race ./...
      - run: go run ./cmd/pallanguzhi bench -games 10
