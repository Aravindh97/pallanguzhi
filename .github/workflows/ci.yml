name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.26"}
      - run: go vet ./...
      - run: GOOS=js GOARCH=wasm go vet ./cmd/web
      - run: go test -race ./...
      - run: go run ./cmd/pallanguzhi bench -games 10
      - name: Load test, 200 games at once over WebSockets
        run: go run ./cmd/loadtest -rooms 200
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.26"}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json}
      - name: TypeScript types match the Go structs
        if: hashFiles('cmd/tsgen/main.go') != ''
        run: go run ./cmd/tsgen && git diff --exit-code web/src/types.gen.ts
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: ./web/build.sh dist
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.26"}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: ./web/build.sh dist
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Two browsers play each other through the Go server
        run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: playwright-traces, path: web/test-results}
